# Kingsway Jiu-Jitsu: knowledge file for the email agent
# Sources: kingswayjiujitsu.com (2026-09-24, re-checked 2026-10-21 on Gymdesk site), Kingsway pricing guide PDF, Elias
# The agent must quote prices, times and policies ONLY from this file.

school:
  name: Kingsway Jiu-Jitsu
  address: 13776 N Hwy 183, Unit #122, Austin, TX 78750
  phone: 737-428-7444 (call or text)   # site footer/signup page show 806-206-0176; confirm which is current
  email: admin@kingswayjiujitsu.com
  instagram: "@kingsway_hq"
  website: https://kingswayjiujitsu.com
  area: North Austin off Hwy 183; easy drive from Cedar Park.
  parking: Free parking right out front (we're in a strip mall).
  lodging: There are several hotels in the area. Don't recommend a specific one.

hours:
  mon_fri: 6:00am - 8:30pm
  sat: 8:30am - 12:00pm
  sun: 9:30am - 12:00pm

instructors:
  head: [John Danaher (founder), Gordon Ryan, Garry Tonon]
  staff: [Nicholas Meregali, Giancarlo Bodoni, Helena Crevar, Luke Griffith,
          Reese LaFever, Landon Elmore, Silas Dubelaar]
  who_teaches:
    pro_classes: John Danaher (all pro classes, weekday and weekend)
    advanced_nogi_7pm: Garry Tonon
    kids_and_teens: Reese LaFever and Landon Elmore
    weekend_adult_classes: Helena Crevar or Reese LaFever (varies)
    everything_else: Not fixed. Don't name an instructor.

programs:
  kids:
    ages: 4-8
    format: always gi
  teens:
    ages: 9-15
    format: gi Mon/Wed/Fri, no-gi Tue/Thu
  beginner:
    level: white to blue belt (all levels welcome)
  advanced:
    format: separate gi and no-gi classes
  pro_session:
    who: professional competition athletes only; taught by John Danaher
    rule: Austin-area cross-trainers not allowed; out-of-town visitors allowed


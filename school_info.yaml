    - 7:00-8:30am  Advanced (Gi)
    - 9:00am   Pro (No-Gi)
    - 12:30pm  Pro (No-Gi)
    - 4:00pm   Kids (Gi)
    - 5:00pm   Teens (Gi)
    - 6:00pm   Beginner (Gi)
    - 7:00-8:30pm  Advanced (No-Gi), taught by Garry Tonon
  tue_thu:
    - 6:00am   Beginner (Gi)
    - 7:00-8:30am  Advanced (Gi)
    - 9:00am   Pro (No-Gi)
    - 12:30pm  Pro (No-Gi)
    - 4:00pm   Kids (Gi)
    - 5:00pm   Teens (No-Gi)
    - 6:00pm   Beginner (No-Gi)
